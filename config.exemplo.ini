# Copie este arquivo para config.ini e ajuste para a sua máquina.
# O config.ini não vai para o Git (está no .gitignore).

[banco]
host = localhost
porta = 3306
usuario = root
senha =
banco_origem = campo_real_energia
banco_dw = dw_campo_real

[pld]
# API da CCEE (padrão CKAN). Hoje ela responde "acesso bloqueado" (HTTP 403),
# então o script tenta a API e, se falhar, lê o CSV baixado do portal.
tentar_api = sim
url_api = https://dadosabertos.ccee.org.br/api/3/action/datastore_search
# pasta (dentro do projeto) onde ficam os CSV baixados do portal
pasta_csv = dados/pld
anos = 2025, 2026
recurso_2025 = 2a180a6b-f092-43eb-9f82-a48798b803dc
recurso_2026 = 3f279d6b-1069-42f7-9b0a-217b084729c4

[clima]
url_api = https://archive-api.open-meteo.com/v1/archive
data_inicio = 2025-01-01
data_fim = 2025-12-31
variaveis = temperature_2m,shortwave_radiation,wind_speed_100m,precipitation
fuso = America/Sao_Paulo

[qualidade]
# limites regulatórios do PLD (R$/MWh): mínimo e máximo horário de cada ano
# 2025: Despacho ANEEL 3.625/2024   2026: Despacho ANEEL 3.850/2025
pld_min_2025 = 58.60
pld_max_2025 = 1542.23
pld_min_2026 = 57.31
pld_max_2026 = 1611.04
# uma medição é considerada atrasada se chegar mais de X horas depois
atraso_maximo_horas = 24
